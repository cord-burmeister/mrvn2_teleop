teleop_twist:
  ros__parameters:
    require_enable_button: false
    axis_linear:
      x: 1
      y: 0
    scale_linear:
      x: 0.7
      y: 0.7
    scale_linear_turbo:
      x: 1.5
      y: 1.5
    axis_angular:
      yaw: 2
    scale_angular:
      yaw: 0.4
    enable_button: 0
    enable_turbo_button: 1

    # Error handling for invalid configuration values
    error_handling:
      invalid_value: "Invalid configuration value detected"
